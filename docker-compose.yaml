services:
  mysql:
    image: mysql:8.4
    container_name: printify-store-mysql-compose
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-case_store}
      MYSQL_USER: ${MYSQL_USER:-case_store}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-case_store_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    volumes:
      - case_store_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    container_name: printify-store-backend-compose
    ports:
      - 3010:3000
    build:
      context: ./backend
      dockerfile: Dockerfile.compose
    env_file:
      - ./backend/.env
    environment:
      DB_ENABLED: "true"
      DB_REQUIRED: "true"
      DB_SYNC: ${DB_SYNC:-true}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-case_store}
      DB_USER: ${MYSQL_USER:-case_store}
      DB_PASSWORD: ${MYSQL_PASSWORD:-case_store_dev}
      PRINTIFY_FULFILLMENT_MODE: ${PRINTIFY_FULFILLMENT_MODE:-draft}
      PRINTIFY_SHIPPING_QUOTE_MINUTES: ${PRINTIFY_SHIPPING_QUOTE_MINUTES:-15}
      AI_STORAGE_ROOT: /app/private-ai-storage
      AI_UPLOAD_MAX_MB: ${AI_UPLOAD_MAX_MB:-8}
      AI_GENERATION_TIMEOUT_MS: ${AI_GENERATION_TIMEOUT_MS:-120000}
      AI_RATE_LIMIT_WINDOW_MS: ${AI_RATE_LIMIT_WINDOW_MS:-60000}
      AI_RATE_LIMIT_MAX: ${AI_RATE_LIMIT_MAX:-6}
      PRINTIFY_AI_PRINT_ON_SIDE: ${PRINTIFY_AI_PRINT_ON_SIDE:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      OPENAI_IMAGE_QUALITY: ${OPENAI_IMAGE_QUALITY:-medium}
    volumes:
      - case_store_ai_storage:/app/private-ai-storage
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    container_name: printify-store-front-compose
    ports:
      - 6124:80
    build:
      context: ./frontend
      dockerfile: Dockerfile.compose
    depends_on:
      - backend

volumes:
  case_store_mysql_data:
  case_store_ai_storage:
